name: Deploy Multi-Container

on:
  push:
    branches:
      - main

#testing
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull all the code to the new virtual machine
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. login on Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Run React tests
      - name: Run Tests
        run: |
          docker build -t matheuspmadruga/react-test -f ./client_frontend/client/Dockerfile.dev ./client_frontend/client
          docker run -e CI=true matheuspmadruga/react-test npm test -- --coverage

      # 4. Build production images
      - name: Build Production Images
        run: |
          docker build -t matheuspmadruga/multi-client ./client_frontend/client
          docker build -t matheuspmadruga/multi-server ./server
          docker build -t matheuspmadruga/multi-worker ./worker
          docker build -t matheuspmadruga/multi-nginx ./nginx

      # 5. Push images to Docker Hub
      - name: Push Images to Docker Hub
        run: |
          docker push matheuspmadruga/multi-client
          docker push matheuspmadruga/multi-server
          docker push matheuspmadruga/multi-worker
          docker push matheuspmadruga/multi-nginx